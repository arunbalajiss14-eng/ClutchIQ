spring.application.name=mevsme
server.port=8080

# ---- MySQL (change username / password to match your MySQL Workbench connection) ----
spring.datasource.url=jdbc:mysql://localhost:3306/mevsme?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate creates / updates the tables for you on start
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Loads a demo coach, team and players on the first run (set to false for a clean database)
app.seed-demo=true
